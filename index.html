<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parrilla de Contenidos · El Santuario</title>
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#111111;
    --surface2:#1a1a1a;
    --border:#2a2a2a;
    --border2:#333;
    --ivory:#f0ead6;
    --ivory-dim:#b8b09a;
    --ivory-muted:#6e6860;
    --pendiente-color:#c0604a;
    --entregado-color:#5dcc5d;
    --entregado-bg:rgba(42,90,42,.22);
    --radio:10px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100vh;}
  body{
    background:var(--bg);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    color:var(--ivory);
  }

  /* ===== HEADER ===== */
  header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:18px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand-row{display:flex; align-items:center; gap:14px;}
  .logo-mark{height:28px; width:auto; flex-shrink:0;}
  .brand-text h1{font-size:1.15rem; font-weight:700; letter-spacing:.01em; color:var(--ivory); line-height:1;}
  .brand-input{
    background:transparent; border:none;
    border-bottom:1px dashed var(--border2);
    color:var(--ivory-dim); font-family:inherit;
    font-size:.78rem; font-style:italic;
    padding:2px 4px; width:200px; margin-top:4px; display:block;
  }
  .brand-input:focus{outline:none; border-bottom-color:var(--ivory);}

  /* month picker */
  .month-wrap{position:relative;}
  .month-btn{
    background:var(--surface2); border:1px solid var(--border2);
    color:var(--ivory); font-family:inherit; font-size:.85rem; font-weight:600;
    padding:8px 14px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .month-btn:hover{border-color:var(--ivory-dim);}
  .chev{transition:transform .15s;}
  .month-btn.open .chev{transform:rotate(180deg);}
  .month-pop{
    position:absolute; top:calc(100% + 8px); right:0;
    background:var(--surface2); border:1px solid var(--border2);
    border-radius:12px; padding:10px;
    display:none; grid-template-columns:repeat(3,84px);
    gap:6px; z-index:200;
    box-shadow:0 12px 32px rgba(0,0,0,.6);
  }
  .month-pop.show{display:grid;}
  .month-cell{
    background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:8px 4px;
    text-align:center; cursor:pointer;
    font-size:.74rem; color:var(--ivory-dim); line-height:1.3;
  }
  .month-cell:hover{border-color:var(--border2); color:var(--ivory);}
  .month-cell.active{background:var(--ivory); color:var(--bg); border-color:var(--ivory); font-weight:700;}
  .month-cell .count{display:block; font-size:.62rem; margin-top:2px; opacity:.65;}

  /* header right */
  .header-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--border2); border-radius:999px;
    padding:7px 16px; font-family:inherit; font-size:.78rem; font-weight:600;
    cursor:pointer; background:transparent; color:var(--ivory);
    transition:background .15s, border-color .15s;
  }
  .btn:hover{background:var(--surface2); border-color:var(--ivory-dim);}
  .btn-primary{background:var(--ivory); color:var(--bg); border-color:var(--ivory);}
  .btn-primary:hover{background:var(--ivory-dim);}
  .readonly-badge{
    background:var(--surface2); border:1px solid var(--border2);
    border-radius:999px; padding:5px 12px;
    font-size:.72rem; color:var(--ivory-muted);
    display:flex; align-items:center; gap:6px;
  }
  .readonly-badge .dot{width:6px;height:6px;border-radius:50%;background:#555;}

  /* ===== MAIN ===== */
  main{max-width:1100px; margin:0 auto; padding:28px 32px 80px;}

  .mes-titulo{
    font-size:1rem; font-weight:700; color:var(--ivory-dim);
    margin-bottom:18px; display:flex; align-items:center; gap:10px;
  }
  .mes-label-input{
    background:transparent; border:none;
    border-bottom:1px dashed var(--border2);
    color:var(--ivory); font-family:inherit;
    font-size:1rem; font-weight:700; padding:2px 0; width:180px;
  }
  .mes-label-input:focus{outline:none; border-bottom-color:var(--ivory);}

  /* ===== FICHAS ===== */
  .cards-list{display:flex; flex-direction:column; gap:7px;}

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radio); overflow:hidden;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--border2);}
  .card.is-entregado .card-row{opacity:.55;}

  /* fila principal */
  .card-row{
    display:grid;
    grid-template-columns: 26px 1fr 150px 130px 36px;
    align-items:center; gap:10px;
    padding:11px 14px; cursor:pointer; user-select:none;
  }

  .card-num{
    font-size:.7rem; font-weight:700; color:var(--ivory-muted); text-align:center;
  }

  .card-titulo-input{
    background:transparent; border:none;
    color:var(--ivory); font-family:inherit;
    font-size:.88rem; font-weight:600;
    width:100%; padding:0;
  }
  .card-titulo-input:focus{outline:none;}
  .card-titulo-input::placeholder{color:var(--ivory-muted); font-weight:400; font-style:italic;}

  .card-numcont-wrap{text-align:center;}
  .card-numcont-label{font-size:.58rem; text-transform:uppercase; letter-spacing:.5px; color:var(--ivory-muted); display:block; margin-bottom:3px;}
  .card-numcont-input{
    background:transparent; border:none;
    border-bottom:1px dashed var(--border);
    color:var(--ivory-dim); font-family:inherit; font-size:.78rem;
    text-align:center; width:100%; padding:1px 0;
  }
  .card-numcont-input:focus{outline:none; border-bottom-color:var(--ivory);}
  .card-numcont-input::placeholder{color:var(--ivory-muted);}

  /* status toggle */
  .status-toggle{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.7rem; font-weight:700; letter-spacing:.3px;
    cursor:pointer; padding:5px 11px; border-radius:999px; border:1px solid;
    white-space:nowrap; transition:all .2s; background:transparent; font-family:inherit;
  }
  .status-toggle.pendiente{color:var(--pendiente-color); border-color:var(--pendiente-color);}
  .status-toggle.entregado{color:var(--entregado-color); border-color:#2a5a2a; background:var(--entregado-bg);}

  /* expand chevron */
  .expand-btn{
    background:none; border:none; color:var(--ivory-muted);
    cursor:pointer; font-size:.85rem; padding:4px; border-radius:4px;
    transition:transform .15s, color .15s; line-height:1;
  }
  .expand-btn:hover{color:var(--ivory);}
  .card.expanded .expand-btn{transform:rotate(180deg);}

  /* cuerpo expandido */
  .card-body{display:none; padding:0 14px 16px; border-top:1px solid var(--border);}
  .card.expanded .card-body{display:block;}
  .card-body-inner{
    display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-top:14px;
  }
  .field label{
    display:block; font-size:.62rem; text-transform:uppercase;
    letter-spacing:.6px; color:var(--ivory-muted); font-weight:700; margin-bottom:5px;
  }
  .field textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border);
    border-radius:6px; color:var(--ivory); font-family:inherit; font-size:.84rem;
    padding:8px 10px; resize:vertical; min-height:72px; line-height:1.5;
  }
  .field textarea:focus{outline:none; border-color:var(--border2);}
  .field textarea::placeholder{color:var(--ivory-muted);}

  .card-actions{
    display:flex; justify-content:flex-end;
    padding-top:10px; margin-top:10px; border-top:1px solid var(--border);
  }
  .del-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ivory-muted); font-size:.72rem; font-family:inherit; padding:4px 8px;
  }
  .del-btn:hover{color:#cc4444;}

  /* add card */
  .add-card-wrap{margin-top:10px;}
  .btn-add{
    background:none; border:1px dashed var(--border2);
    color:var(--ivory-muted); border-radius:8px;
    padding:9px 18px; font-size:.8rem; cursor:pointer;
    font-family:inherit; transition:all .15s;
  }
  .btn-add:hover{border-color:var(--ivory-dim); color:var(--ivory);}

  /* ===== FOOTER ===== */
  footer{
    position:sticky; bottom:0;
    background:var(--surface); border-top:1px solid var(--border);
    padding:11px 32px;
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap;
  }
  .footer-info{font-size:.7rem; color:var(--ivory-muted);}

  /* toast */
  .toast{
    position:fixed; bottom:66px; right:24px;
    background:var(--surface2); border:1px solid var(--border2);
    color:var(--ivory); padding:8px 16px; border-radius:8px;
    font-size:.8rem; opacity:0; transform:translateY(6px);
    transition:opacity .22s, transform .22s; z-index:999; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  /* readonly */
  body.readonly-mode .btn-add,
  body.readonly-mode .del-btn,
  body.readonly-mode .add-card-wrap{display:none !important;}
  body.readonly-mode .card-titulo-input,
  body.readonly-mode .mes-label-input,
  body.readonly-mode .brand-input,
  body.readonly-mode .field textarea,
  body.readonly-mode .card-numcont-input{pointer-events:none; cursor:default;}

  @media(max-width:700px){
    header{padding:12px 16px;}
    main{padding:16px 14px 80px;}
    footer{padding:9px 16px;}
    .card-row{grid-template-columns:22px 1fr 90px 32px;}
    .card-numcont-wrap{display:none;}
  }

</style>
</head>

  <div class="header-right">
    <div id="readonlyBadge" class="readonly-badge" style="display:none">
      <span class="dot"></span> Solo lectura
    </div>
    <div class="month-wrap" id="monthWrap">
      <button class="month-btn" id="monthBtn">
        <span id="monthLabel">—</span>
        <svg class="chev" width="12" height="7" viewBox="0 0 12 7" fill="none">
          <path d="M1 1l5 5 5-5" stroke="#f0ead6" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="month-pop" id="monthPop"></div>
    </div>
    <button class="btn btn-primary" id="btnCompartir">⬡ Compartir mes</button>
  </div>
</header>

<main id="mainContent"></main>

<footer id="mainFooter">
  <div class="footer-info">Datos guardados automáticamente en este navegador.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ========== CONSTANTES ========== */
const MES_NOMBRES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const STORAGE_KEY = "parrilla_v3";
const DEFAULT_CARDS = 8;

/* ========== MODO READONLY ========== */
const urlParams = new URLSearchParams(location.search);
const IS_READONLY = urlParams.has('ver');

/* ========== ESTADO ========== */
function cid(){ return 'c'+Math.random().toString(36).slice(2,9); }

function makeCard(num){
  return { id:cid(), titulo:"", numContenido: num ? String(num) : "", descripcion:"", formato:"", estado:"pendiente" };
}

function defaultState(){
  return {
    brand:"",
    activeMonth: new Date().getMonth(),
    months: MES_NOMBRES.map((label,i)=>({
      label, monthIndex:i,
      cards: Array.from({length:DEFAULT_CARDS}, (_,i)=> makeCard(i+1))
    }))
  };
}

let state;

if(IS_READONLY){
  try{
    const payload = JSON.parse(decodeURIComponent(escape(atob(urlParams.get('ver')))));
    // Construir state mínimo con solo el mes compartido
    state = defaultState();
    state.brand = payload.brand || "";
    state.activeMonth = payload.mesIndex || 0;
    if(payload.cards){
      state.months[state.activeMonth].cards = payload.cards;
      state.months[state.activeMonth].label = payload.mesLabel || state.months[state.activeMonth].label;
    }
  }catch(e){ state = defaultState(); }
  document.body.classList.add('readonly-mode');
  document.getElementById('readonlyBadge').style.display = 'flex';
  document.getElementById('btnCompartir').style.display = 'none';
  document.getElementById('monthWrap').style.display = 'none';
  document.getElementById('mainFooter').style.display = 'none';
  document.getElementById('brandName').setAttribute('readonly','');
} else {
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      // garantizar ids
      state.months.forEach(m=> m.cards.forEach(c=>{ if(!c.id) c.id=cid(); }));
    } else { state = defaultState(); }
  }catch(e){ state = defaultState(); }
  document.getElementById('btnCompartir').addEventListener('click', compartir);
}

if(typeof state.activeMonth !== 'number') state.activeMonth = 0;

function save(){
  if(IS_READONLY) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ========== RENDER ========== */
function render(){
  document.getElementById('brandName').value = state.brand || "";
  renderMonthPicker();
  renderMonth();
}

function renderMonthPicker(){
  const active = state.months[state.activeMonth];
  document.getElementById('monthLabel').textContent = active.label;
  const pop = document.getElementById('monthPop');
  pop.innerHTML = "";
  state.months.forEach((mo,idx)=>{
    const div = document.createElement('div');
    div.className = 'month-cell'+(idx===state.activeMonth?' active':'');
    const ent = mo.cards.filter(c=>c.estado==='entregado').length;
    div.innerHTML = `${mo.label}<span class="count">${ent}/${mo.cards.length}</span>`;
    div.addEventListener('click',()=>{
      state.activeMonth = idx; save(); closePop(); render();
    });
    pop.appendChild(div);
  });
}

function renderMonth(){
  const container = document.getElementById('mainContent');
  container.innerHTML = "";
  const m = state.months[state.activeMonth];

  // Título del mes (editable)
  const tWrap = document.createElement('div');
  tWrap.className = 'mes-titulo';
  if(IS_READONLY){
    tWrap.textContent = m.label;
  } else {
    const inp = document.createElement('input');
    inp.className = 'mes-label-input';
    inp.type = 'text';
    inp.value = m.label;
    inp.placeholder = 'Mes';
    inp.addEventListener('input', e=>{ m.label = e.target.value; save(); renderMonthPicker(); });
    tWrap.appendChild(inp);
  }
  container.appendChild(tWrap);

  // Lista de fichas
  const list = document.createElement('div');
  list.className = 'cards-list';
  m.cards.forEach((card,idx)=> list.appendChild(buildCard(card, m, idx)));
  container.appendChild(list);

  // Botón agregar
  if(!IS_READONLY){
    const addWrap = document.createElement('div');
    addWrap.className = 'add-card-wrap';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add';
    addBtn.textContent = '+ Agregar ficha';
    addBtn.addEventListener('click',()=>{
      m.cards.push(makeCard(m.cards.length+1)); save(); renderMonth(); renderMonthPicker();
      showToast("Ficha agregada");
    });
    addWrap.appendChild(addBtn);
    container.appendChild(addWrap);
  }
}

function buildCard(card, m, idx){
  const wrap = document.createElement('div');
  wrap.className = 'card'+(card.estado==='entregado'?' is-entregado':'');
  wrap.dataset.id = card.id;

  const esEnt = card.estado === 'entregado';

  /* ---- fila principal ---- */
  const row = document.createElement('div');
  row.className = 'card-row';

  // Número de ficha
  const numEl = document.createElement('div');
  numEl.className = 'card-num';
  numEl.textContent = idx+1;

  // Título
  const tituloInp = document.createElement('input');
  tituloInp.className = 'card-titulo-input';
  tituloInp.type = 'text';
  tituloInp.value = card.titulo;
  tituloInp.placeholder = 'Título del contenido';
  if(IS_READONLY) tituloInp.readOnly = true;
  tituloInp.addEventListener('input', e=>{
    const c = m.cards.find(x=>x.id===card.id); if(c){ c.titulo=e.target.value; save(); }
  });

  // N° contenido
  const numContWrap = document.createElement('div');
  numContWrap.className = 'card-numcont-wrap';
  const numContLabel = document.createElement('span');
  numContLabel.className = 'card-numcont-label';
  numContLabel.textContent = 'N° contenido';
  const numContInp = document.createElement('input');
  numContInp.className = 'card-numcont-input';
  numContInp.type = 'text';
  numContInp.value = card.numContenido;
  numContInp.placeholder = '—';
  if(IS_READONLY) numContInp.readOnly = true;
  numContInp.addEventListener('click', e=> e.stopPropagation());
  numContInp.addEventListener('input', e=>{
    const c = m.cards.find(x=>x.id===card.id); if(c){ c.numContenido=e.target.value; save(); }
  });
  numContWrap.appendChild(numContLabel);
  numContWrap.appendChild(numContInp);

  // Toggle estado
  const toggle = document.createElement('button');
  toggle.className = 'status-toggle '+(esEnt?'entregado':'pendiente');
  toggle.textContent = esEnt ? '✓ Entregado' : '○ Pendiente';
  if(IS_READONLY && esEnt) toggle.disabled = true;
  toggle.addEventListener('click', e=>{
    e.stopPropagation();
    const c = m.cards.find(x=>x.id===card.id); if(!c) return;
    if(IS_READONLY){
      if(c.estado !== 'entregado'){
        c.estado = 'entregado';
        renderMonth(); renderMonthPicker();
        showToast("Marcado como entregado ✓");
      }
    } else {
      c.estado = c.estado==='entregado' ? 'pendiente' : 'entregado';
      save(); renderMonth(); renderMonthPicker();
    }
  });

  // Chevron expandir
  const expBtn = document.createElement('button');
  expBtn.className = 'expand-btn';
  expBtn.innerHTML = '▾';
  expBtn.title = 'Ver detalles';
  expBtn.addEventListener('click', e=>{
    e.stopPropagation(); wrap.classList.toggle('expanded');
  });

  row.appendChild(numEl);
  row.appendChild(tituloInp);
  row.appendChild(numContWrap);
  row.appendChild(toggle);
  row.appendChild(expBtn);

  // Click en la fila para expandir (excepto inputs/buttons)
  row.addEventListener('click', e=>{
    if(e.target.closest('input,button,select,textarea')) return;
    wrap.classList.toggle('expanded');
  });

  /* ---- cuerpo expandido ---- */
  const body = document.createElement('div');
  body.className = 'card-body';

  const inner = document.createElement('div');
  inner.className = 'card-body-inner';

  // Descripción
  const fDesc = document.createElement('div');
  fDesc.className = 'field';
  const lblDesc = document.createElement('label');
  lblDesc.textContent = 'Descripción';
  const taDesc = document.createElement('textarea');
  taDesc.placeholder = 'De qué trata este contenido...';
  taDesc.value = card.descripcion;
  if(IS_READONLY) taDesc.readOnly = true;
  taDesc.addEventListener('input', e=>{
    const c = m.cards.find(x=>x.id===card.id); if(c){ c.descripcion=e.target.value; save(); }
  });
  fDesc.appendChild(lblDesc); fDesc.appendChild(taDesc);

  // Formato
  const fFmt = document.createElement('div');
  fFmt.className = 'field';
  const lblFmt = document.createElement('label');
  lblFmt.textContent = 'Formato';
  const taFmt = document.createElement('textarea');
  taFmt.placeholder = 'Reel, carrusel, foto, story...';
  taFmt.value = card.formato;
  if(IS_READONLY) taFmt.readOnly = true;
  taFmt.addEventListener('input', e=>{
    const c = m.cards.find(x=>x.id===card.id); if(c){ c.formato=e.target.value; save(); }
  });
  fFmt.appendChild(lblFmt); fFmt.appendChild(taFmt);

  inner.appendChild(fDesc);
  inner.appendChild(fFmt);
  body.appendChild(inner);

  // Eliminar (solo edición)
  if(!IS_READONLY){
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = 'Eliminar ficha';
    delBtn.addEventListener('click', e=>{
      e.stopPropagation();
      if(!confirm('¿Eliminar esta ficha?')) return;
      m.cards = m.cards.filter(x=>x.id!==card.id);
      save(); renderMonth(); renderMonthPicker();
      showToast("Ficha eliminada");
    });
    actions.appendChild(delBtn);
    body.appendChild(actions);
  }

  wrap.appendChild(row);
  wrap.appendChild(body);
  return wrap;
}

/* ========== MONTH PICKER ========== */
document.getElementById('monthBtn').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('monthPop').classList.toggle('show');
  document.getElementById('monthBtn').classList.toggle('open');
});
document.addEventListener('click', e=>{
  if(!document.getElementById('monthWrap').contains(e.target)) closePop();
});
function closePop(){
  document.getElementById('monthPop').classList.remove('show');
  document.getElementById('monthBtn').classList.remove('open');
}

/* ========== BRAND ========== */
document.getElementById('brandName').addEventListener('input', e=>{
  state.brand = e.target.value; save();
});

/* ========== COMPARTIR ========== */
function compartir(){
  try{
    // Solo compartir el mes activo — URL más corta y manejable
    const m = state.months[state.activeMonth];
    const payload = {
      brand: state.brand || "",
      mesLabel: m.label,
      mesIndex: state.activeMonth,
      cards: m.cards
    };
    const json = JSON.stringify(payload);
    const encoded = btoa(unescape(encodeURIComponent(json)));
    const url = location.origin + location.pathname + '?ver=' + encoded;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(()=> showToast("Link copiado ✓ — " + m.label))
        .catch(()=> prompt("Copia este link para compartir " + m.label + ":", url));
    } else {
      prompt("Copia este link para compartir " + m.label + ":", url);
    }
  }catch(e){ showToast("Error al generar el link"); }
}

/* ========== TOAST ========== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ========== INIT ========== */
render();
</script>
</body>
</html>
